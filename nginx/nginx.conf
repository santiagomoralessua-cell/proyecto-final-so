# Se monta como /etc/nginx/conf.d/default.conf (igual que en lab-proxy)

# Log que muestra a qué backend fue cada petición y cuánto tardó
log_format balanceo '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr rt=$request_time';

# Las 3 instancias. Sin algoritmo explícito, Nginx usa round-robin.
upstream backends {
    # Memoria compartida: todos los workers de Nginx usan el mismo turno
    # del round-robin (sin esto, cada worker lleva su propio turno)
    zone backends 64k;

    server app1:5000 max_fails=3 fail_timeout=10s;
    server app2:5000 max_fails=3 fail_timeout=10s;
    server app3:5000 max_fails=3 fail_timeout=10s;
}

# Proxy inverso: lo único publicado al host (puerto 8080)
server {
    listen 80;
    access_log /var/log/nginx/access.log balanceo;

    location / {
        proxy_pass http://backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Si un backend se cae, Nginx reintenta en el siguiente
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;

        add_header X-Upstream $upstream_addr always;
    }

    # Las métricas de los backends no se exponen al público
    location /metrics {
        return 403;
    }
}

# stub_status para nginx-prometheus-exporter (solo red interna, puerto 8088)
server {
    listen 8088;
    access_log off;

    location /stub_status {
        stub_status;
    }
}